[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-costs"
version = "1.0.0"
description = "Cost reporter for OpenCode sessions — detailed breakdown per agent and sub-agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Carlos"}
]
keywords = ["opencode", "cost", "llm", "tokens", "cli", "agent", "sub-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "rich>=13.0",
]

[project.scripts]
costs = "opencode_costs.cli:main"

[project.urls]
Homepage = "https://github.com/Caertos/opencode-costs"
Repository = "https://github.com/Caertos/opencode-costs"
Issues = "https://github.com/Caertos/opencode-costs/issues"

[tool.setuptools.packages.find]
include = ["opencode_costs*"]
