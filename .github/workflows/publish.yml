name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check the token and package (no publish)"
        type: boolean
        default: true

jobs:
  verify:
    name: Verify version and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Version must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"

      - name: Run tests
        run: npm test

      - name: Build must match dist/
        run: |
          npm run build
          if ! git diff --quiet -- dist; then
            echo "dist/ is stale. Run 'npm run build' and commit the result." >&2
            exit 1
          fi

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Is this version already on npm?
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "opencode-costs-tui@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "opencode-costs-tui@$version is already published; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "opencode-costs-tui@$version is not published yet."
          fi

      - name: Check the npm token
        if: steps.published.outputs.exists == 'false'
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (dry run)
        if: steps.published.outputs.exists == 'false' && github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --provenance --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with provenance
        if: steps.published.outputs.exists == 'false' && (github.event_name == 'push' || inputs.dry_run == false)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
